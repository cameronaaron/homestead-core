# Sun Brewed Homestead — Linear workspace, as code.
#
#   homestead linear-provision            # show the plan (read-only)
#   homestead linear-provision --apply    # make Linear match this file
#
# Matched by name. Nothing that isn't in this file is deleted or renamed:
# issues, extra labels and projects people create by hand are left alone.

[team]
key = "SUN"
name = "Sunbrewed Homestead"
description = "Everything it takes to run the homestead: garden, animals, Kiki's Cat Club, workshops, farm stand and the community around them."
timezone = "America/Los_Angeles"

# Any other team setting, by its Linear API name (see TeamUpdateInput in
# Linear's GraphQL schema). A …StateId may name a workflow state.
[team.settings]
cyclesEnabled = false
triageEnabled = false
issueEstimationType = "notUsed"
# Months before closed issues are archived / stale issues auto-close.
autoArchivePeriod = 6
autoClosePeriod = 6
autoCloseStateId = "Canceled"

# Workflow states to ensure exist (Linear's defaults are kept as they are).
[[states]]
name = "Waiting"
type = "started"
color = "#E2963B"
description = "Blocked on something outside our hands: supplies, weather, the vet, a volunteer."

