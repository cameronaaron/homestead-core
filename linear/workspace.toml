# ── People ────────────────────────────────────────────────────────────────────
#
# Email = workspace role: "admin", "member" or "guest". Anyone missing is
# invited to the workspace and this team, and listed people's roles and
# team membership are kept in line. Nobody is ever removed: people who
# aren't listed are reported as unmanaged. The workspace owner stays owner.
[members]
"steward@example.org" = "admin"
"sunbrewedhomestead@gmail.com" = "admin" # oss-publish:allow: the org's shared mailbox
