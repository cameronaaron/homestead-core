# Projects. `status` is a Linear project status name. `content` seeds the
# project's document when it's created; after that it belongs to the team
# and is never overwritten from here.
[[projects]]
name = "Grow the Valley campaign"
status = "Planned"
color = "#E2963B"
description = "Build, review and launch our $15,000 Zeffy campaign (kept private until launch)."
content = """
The campaign lives in `zeffy/campaign.toml` in the homestead repo, which CI checks against Zeffy.

**Launch checklist**
- [ ] Build the form in Zeffy from the spec, and leave it in Draft
- [ ] Board reviews goal and budget
- [ ] Spanish translation reviewed by a native speaker
- [ ] Flip `status` to "active" in the spec, then publish in Zeffy
- [ ] Announce on Instagram, Facebook, Nextdoor and in Discord
"""

