# Sun Brewed Homestead — Discord server, as code.
#
#   homestead discord-provision            # show the plan (read-only)
#   homestead discord-provision --apply    # make the server match this file
#
# Re-running is safe: things are matched by name and only changed when they
# differ. Nothing that isn't in this file is ever deleted. It is reported
# as "unmanaged" instead, so you can tidy by hand.
#
# In topics and messages, <#channel-name> becomes a clickable channel link.
#
# Access model: people join from the link on Instagram (<core>/join): they
# sign the welcome agreement first, then connect Discord; the bot adds that
# exact account as a Volunteer. Anyone who came in another way holds no
# role and sees only "Start here", which points them to the same link (or
# /onboard). The daily sync writes new role holders under [members] below;
# change their roles there. `readers` can see a
# category/channel; `writers` (default: every reader) can post. Stewards
# have Administrator and see everything. "@everyone" means every member.

[server]
name = "Sun Brewed Homestead"
# 1 = members need a verified email before they can talk.
verification_level = 1
# 1 = notify only on @mentions (farm chatter shouldn't buzz every phone).
default_message_notifications = 1
# 2 = scan media from everyone.
explicit_content_filter = 2
# Where Discord posts "X joined" messages.
system_channel = "welcome"
# Discord's own #general is adopted into Community below; its now-empty
# starter categories and "General" voice channel are removed.
remove_starter_channels = true
# Brand: warm sun amber for the bot's cards; the homestead mark as icon/avatar.
accent = "#E2963B"
icon = "brand/mark-1024.png"
bot_avatar = "brand/mark-1024.png"

# What every member can do, before any channel restrictions.
everyone_permissions = [
  "view_channel", "send_messages", "send_messages_in_threads", "create_public_threads",
  "embed_links", "attach_files", "read_message_history", "add_reactions",
  "use_external_emojis", "use_external_stickers", "use_application_commands",
  "change_nickname", "connect", "speak", "stream", "use_vad",
  "send_voice_messages", "send_polls",
]

# Anything else Discord lets a server change, by its API field name
# (discord.com/developers/docs/resources/guild#modify-guild). A
# *_channel_id may name a channel. Each channel takes the same kind of table
# for Modify Channel fields: slowmode, nsfw, user_limit, bitrate…
#   settings = { rate_limit_per_user = 60 }
# A field Discord doesn't recognise fails the apply by name, rather than
# being silently ignored.
[server.settings]
preferred_locale = "en-US"
afk_timeout = 300
# description = "A community homestead and 501(c)(3) in Van Nuys."
# afk_channel_id = "Farmhouse"

# Roles, highest first. Ordering is what Discord shows in the member list.
[[roles]]
name = "Steward"
color = "#C7771B"
hoist = true
mentionable = true
about = "Founders/admins: full control."
permissions = ["administrator"]

[[roles]]
name = "Farm Lead"
color = "#3D7A3A"
hoist = true
mentionable = true
about = "Runs day-to-day operations; moderates."
permissions = [
  "manage_messages", "manage_threads", "manage_events", "create_events",
  "moderate_members", "kick_members", "mention_everyone", "create_instant_invite",
  "manage_nicknames", "mute_members", "move_members", "priority_speaker", "view_audit_log",
]

[[roles]]
name = "Board"
color = "#6B5B95"
hoist = true
mentionable = true
about = "Nonprofit board: leadership + read-only view of operations."
permissions = []

[[roles]]
name = "Crew"
color = "#D9A441"
hoist = true
mentionable = true
about = "Core team working the farm."
permissions = ["create_instant_invite", "create_events", "create_private_threads"]

[[roles]]
name = "Volunteer"
color = "#7FB3D5"
hoist = true
mentionable = true
about = "Volunteers: shifts, training, community."
permissions = []

[[roles]]
name = "Community"
color = "#A3B18A"
hoist = false
mentionable = false
about = "Neighbours, members, supporters."
permissions = []

# Working groups: who to ping for which kind of work. They grant no
# permissions; each opens the one channel where its work is planned, and a
# person also holds an access role (Volunteer, Crew…) for everything else.
[[roles]]
name = "Grants & Business"
color = "#E2963B"
hoist = false
mentionable = true
about = "Working group: grant writing, sponsors, budgets and paperwork."
permissions = []

[[roles]]
name = "Farm & Labor"
color = "#8CCB5E"
hoist = false
mentionable = true
about = "Working group: work days, builds, planting and animal chores."
permissions = []

[[roles]]
name = "Social Media"
color = "#D9432B"
hoist = false
mentionable = true
about = "Working group: Instagram, Facebook, Nextdoor and photos."
permissions = []

# ── People ────────────────────────────────────────────────────────────────────
#
# Discord username (the unique @handle on their profile, not their display
# name) = the roles above they should hold. Usernames with a "." need quotes:
#   "kiki.sun" = ["Volunteer"]
#
# Listed people get exactly these roles; any other role from this file is
# taken away. Roles outside this file are left alone.
# Someone who hasn't joined yet is reported as pending (a bot can't add
# people to a server); send them the invite link and re-run once they're in.
# Removing a line leaves that person's roles as they are. To take access
# away, set their list to [] instead. Unlisted people are reported as
# "unmanaged" with the roles they hold. (The bot needs Server Members
# Intent on, under Developer Portal → Bot.)
[members]
kamiof2000 = ["Steward", "Volunteer"]
rtocastro3982 = ["Volunteer"]
"capt.outlaw" = ["Board", "Farm Lead", "Farm & Labor", "Social Media", "Grants & Business", "Volunteer", "Steward", "Community", "Crew"]

# ── Channels ──────────────────────────────────────────────────────────────────

[[categories]]
name = "📌 Start here"
readers = ["@everyone"]
writers = ["Farm Lead"]

  [[categories.channels]]
  name = "welcome"
  topic = "Welcome to Sun Brewed Homestead 🌞 Read <#rules>, then sign our welcome agreement at https://homestead.example.org/join to open the channels."
  title = "Welcome to Sun Brewed Homestead 🌞"
  message = """
*Sowing sustainability, growing community.*

We're a community homestead on Woodman Avenue in Van Nuys, and a 501(c)(3) nonprofit. We believe everyone deserves the chance to grow their own food, care for animals and live a little more self-sufficiently, and that it's easier together.

**What happens here**
🌱 Free hands-on workshops: gardening, Composting 101, seed starting
🐐 Our goats and chickens
🐈 **Kiki's Cat Club**: rescue cats looking for homes
🧺 The farm stand

**Getting started**
1. Read <#rules>.
2. Can only see this channel? Sign our welcome agreement at https://homestead.example.org/join (about five minutes on a phone): how we work together, the liability waiver, photo permission and keeping each other's information private.
3. Connect Discord and the **Volunteer** channels open automatically—no command or username needed.

Joining the core team as **Crew**, or a working group? A steward adds that once you've signed.

🌐 [sunbrewedhomestead.org](https://sunbrewedhomestead.org) · 📸 [Instagram](https://www.instagram.com/sunbrewedhomestead/) · 👍 [Facebook](https://www.facebook.com/sunbrewedhomestead/) · 🏡 [Nextdoor](https://nextdoor.com/pages/sun-brewed-homestead-van-nuys-ca/)
"""

  [[categories.channels]]
  name = "rules"
  topic = "How we look after each other here."
  title = "House rules 🌻"
  message = """
1. **Be kind.** Everyone here is growing something, including themselves.
2. **Safety first.** Tools, animals and heat are real. If something's unsafe, say so in <#daily-log> or tell a Farm Lead.
3. **Ask before you post people.** Especially kids at workshops. Animals and veggies are always fair game. 🐐
4. **Keep it on-topic.** Use threads for long conversations.
5. **No spam, selling or recruiting** without asking a steward first.
6. **Board and money matters stay in Leadership.**

Breaking these can get you muted or removed. Questions? Ask a **Farm Lead** or **Steward**.
"""

  [[categories.channels]]
  name = "announcements"
  topic = "Official news from the homestead. Only leads post here."

