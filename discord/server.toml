  writers = ["Farm Lead"]
  title = "🦝 When wildlife turns up"
  pinned = true
  message = """
**Call first. Do not capture, handle, confine, feed or water wildlife without guidance from a trained professional.** Keep children, dogs and the farm animals away. Never drop an animal off unless a rehabilitator tells you to.

If an animal is visibly injured, sick or orphaned:
1. Call a permitted rehabilitator before moving it. They may tell you to leave a healthy youngster for its parent.
2. If a professional tells you to contain it, use gloves and a ventilated box in a dark, quiet place, away from people and animals.
3. An unpermitted person may confine it for **no more than 24 hours**. Within that same 24 hours, give the rehabilitator or CDFW your name and phone, the species, its condition, when and where it was found, and where it is confined. CDFW Wildlife Health Lab: **(916) 358-2790** / **RehabWildlife@wildlife.ca.gov**.
4. Post what happened and where the animal went in <#daily-log>.

**Los Angeles County permitted rehabilitators — call ahead; capacity changes**
• California Wildlife Center, Malibu — **(310) 458-9453** — mammals, birds, reptiles
• Pasadena Humane Society — **(626) 344-1129** — mammals, birds, reptiles
• Coast & Canyon Wildlife, Malibu — **(310) 480-1760** — mammals, birds
• Antelope Valley Wildlife Rescue, Lancaster — **(661) 272-4551** — mammals, birds
• Cleo's Critter Care, Pasadena — **(626) 715-0262** — mammals
• Squirrel Whisperer, Santa Clarita — **(661) 251-7978** — small mammals
• International Bird Rescue, San Pedro — **(310) 514-2573** — birds
• San Dimas Raptor Rescue — **(909) 599-7512** — birds of prey
• LA Bat Rescue, Manhattan Beach — **(310) 365-5656** — bats

[CDFW finder guidance](https://wildlife.ca.gov/Conservation/Laboratories/Wildlife-Health/Rehab/Sick-Injured) · [current facility list](https://wildlife.ca.gov/Conservation/Laboratories/Wildlife-Health/Rehab/Facilities) · [current §679 rules](https://wildlife.ca.gov/Conservation/Laboratories/Wildlife-Health/Rehab/Regulations)
"""

