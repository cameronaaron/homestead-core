<text x="98" y="549" font-size="32" fill="#223c2b" >TOML</text>
<rect x="392" y="411" width="296" height="166" rx="18" fill="#fffaf0" stroke="#d9cbb4"/>
<text x="418" y="454" font-size="24" fill="#806035" font-weight="700" letter-spacing="1.5">LIVE</text>
<text x="418" y="507" font-size="32" fill="#223c2b" >Current</text>
<text x="418" y="549" font-size="32" fill="#223c2b" >API state</text>
