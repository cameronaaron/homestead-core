<rect x="255" y="640" width="570" height="80" rx="18" fill="#173224" stroke="#173224"/>
<text x="540" y="691" font-size="36" fill="#f6efdf" text-anchor="middle" font-weight="700">Three-way merge</text>
<text x="72" y="778" font-size="32" fill="#223c2b" >Baseline stored in its own Git ref:</text>
<text x="72" y="823" font-size="36" fill="#47733e" font-family="Menlo, monospace">refs/homestead/live</text>
<text x="72" y="894" font-size="32" fill="#223c2b" >Repo-only edit</text>
<text x="480" y="894" font-size="32" fill="#47733e" >→</text>
<text x="536" y="894" font-size="32" fill="#223c2b" font-weight="700">Keep the intent</text>
<text x="72" y="948" font-size="32" fill="#223c2b" >Live-only edit</text>
<text x="480" y="948" font-size="32" fill="#47733e" >→</text>
<text x="536" y="948" font-size="32" fill="#223c2b" font-weight="700">Update TOML</text>
<text x="72" y="1002" font-size="32" fill="#223c2b" >Independent edits</text>
<text x="480" y="1002" font-size="32" fill="#47733e" >→</text>
<text x="536" y="1002" font-size="32" fill="#223c2b" font-weight="700">Merge</text>
<text x="72" y="1056" font-size="32" fill="#223c2b" >Conflicting edits</text>
<text x="480" y="1056" font-size="32" fill="#47733e" >→</text>
<text x="536" y="1056" font-size="32" fill="#223c2b" font-weight="700">Stop + name the field</text>
<rect x="72" y="1094" width="936" height="117" rx="18" fill="#e8dec8" stroke="#e8dec8"/>
<text x="108" y="1142" font-size="30" fill="#223c2b" font-weight="700">Why a separate baseline, not the last commit?</text>
<text x="108" y="1185" font-size="30" fill="#223c2b" >An unapplied setting isn’t a dashboard edit.</text>
<path d="M72 1249H1008" stroke="#cabb9f"/>
