<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Tests that read the code.</title>
<desc id="desc">Security and correctness rules enforced by tests that inspect every route, every write and real permission maths.</desc>
<rect width="1080" height="1350" fill="#14291e"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="72" y="82" font-size="21" fill="#eac894" font-weight="700" letter-spacing="3">SUN BREWED HOMESTEAD</text>
<text x="1008" y="82" font-size="18" fill="#a5b8a4" font-family="Menlo, monospace" text-anchor="end">FIELD NOTES / 04</text>
<path d="M72 113H1008" stroke="#4a6147"/>
<text x="72" y="219" font-size="72" fill="#f6efdf" font-family="Georgia, serif">Tests that</text>
<text x="72" y="305" font-size="72" fill="#b8d99b" font-family="Georgia, serif">read the code.</text>
<text x="72" y="370" font-size="34" fill="#b9cbb3">A rule without a check is a suggestion.</text>
<rect x="72" y="416" width="936" height="176" rx="18" fill="#0c1b13" stroke="#4a6147"/>
<text x="108" y="460" font-size="24" fill="#95b48a" font-family="Menlo, monospace">a_caller_without_capabilities_…</text>
<text x="108" y="512" font-size="32" fill="#f6efdf" font-weight="700">Every route, no permissions → 403.</text>
<text x="108" y="556" font-size="28" fill="#b9cbb3">Finds each route in the source and calls it.</text>
<rect x="72" y="612" width="936" height="176" rx="18" fill="#0c1b13" stroke="#4a6147"/>
<text x="108" y="656" font-size="24" fill="#95b48a" font-family="Menlo, monospace">writes_are_attributed</text>
<text x="108" y="708" font-size="32" fill="#f6efdf" font-weight="700">Every write names who made it.</text>
<text x="108" y="752" font-size="28" fill="#b9cbb3">Scans the store; fails on an unaudited write.</text>
<rect x="72" y="808" width="936" height="176" rx="18" fill="#0c1b13" stroke="#4a6147"/>
<text x="108" y="852" font-size="24" fill="#95b48a" font-family="Menlo, monospace">access_matrix_matches_…</text>
<text x="108" y="904" font-size="32" fill="#f6efdf" font-weight="700">Discord access, computed for real.</text>
<text x="108" y="948" font-size="28" fill="#b9cbb3">Guards the bug that once silenced #announcements.</text>
<rect x="72" y="1004" width="936" height="207" rx="18" fill="#b8d99b"/>
<text x="108" y="1050" font-size="24" fill="#173224" font-weight="700" letter-spacing="1.5">RACE CONDITIONS, TESTED HONESTLY</text>
<text x="108" y="1098" font-size="30" fill="#173224">Racing two calls passed even with the lock removed.</text>
<text x="108" y="1140" font-size="30" fill="#173224">Holding one transaction open fails without it,</text>
<text x="108" y="1182" font-size="30" fill="#173224" font-weight="700">every time. That’s the version that shipped.</text>
<path d="M72 1249H1008" stroke="#4a6147"/>
<text x="72" y="1297" font-size="20" fill="#b7c9b0" letter-spacing="1.5">548 TESTS · RBAC · AUDIT · CONCURRENCY</text>
<text x="1008" y="1297" font-size="24" fill="#eac894" text-anchor="end">4 / 6</text>
</g></svg>
