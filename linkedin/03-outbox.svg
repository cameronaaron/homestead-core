<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Never lose a harvest.</title>
<desc id="desc">A transactional outbox: the record and its event commit together, then a dispatcher delivers to Discord, Linear and Buffer with retries.</desc>
<rect width="1080" height="1350" fill="#f6efdf"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="72" y="82" font-size="21" fill="#806035" font-weight="700" letter-spacing="3">SUN BREWED HOMESTEAD</text>
<text x="1008" y="82" font-size="18" fill="#536649" font-family="Menlo, monospace" text-anchor="end">FIELD NOTES / 03</text>
<path d="M72 113H1008" stroke="#cabb9f"/>
<text x="72" y="219" font-size="72" fill="#223c2b" font-family="Georgia, serif">Never lose</text>
<text x="72" y="305" font-size="72" fill="#47733e" font-family="Georgia, serif">a harvest.</text>
<text x="72" y="370" font-size="34" fill="#223c2b">The record and its event commit together.</text>
<rect x="72" y="416" width="936" height="128" rx="18" fill="#fffaf0" stroke="#d9cbb4"/>
<text x="108" y="462" font-size="24" fill="#806035" font-weight="700" letter-spacing="1.5">ONE POSTGRES TRANSACTION</text>
<rect x="108" y="482" width="400" height="44" rx="10" fill="#e8dec8"/>
<text x="308" y="513" font-size="28" fill="#223c2b" text-anchor="middle" font-family="Menlo, monospace">harvests</text>
<text x="540" y="514" font-size="30" fill="#47733e" text-anchor="middle">+</text>
<rect x="572" y="482" width="400" height="44" rx="10" fill="#e8dec8"/>
<text x="772" y="513" font-size="28" fill="#223c2b" text-anchor="middle" font-family="Menlo, monospace">outbox event</text>
<path d="M540 544V586" stroke="#47733e" stroke-width="3"/><path d="M531 576L540 586L549 576" fill="none" stroke="#47733e" stroke-width="3"/>
<rect x="255" y="590" width="570" height="80" rx="18" fill="#173224"/>
<text x="540" y="641" font-size="34" fill="#f6efdf" text-anchor="middle" font-weight="700">Dispatcher</text>
<path d="M540 670V700H220V730M540 700V730M540 700H860V730" fill="none" stroke="#47733e" stroke-width="3"/>
<rect x="72" y="732" width="296" height="90" rx="18" fill="#fffaf0" stroke="#d9cbb4"/>
<text x="220" y="788" font-size="32" fill="#223c2b" text-anchor="middle">Discord</text>
<rect x="392" y="732" width="296" height="90" rx="18" fill="#fffaf0" stroke="#d9cbb4"/>
<text x="540" y="788" font-size="32" fill="#223c2b" text-anchor="middle">Linear</text>
<rect x="712" y="732" width="296" height="90" rx="18" fill="#fffaf0" stroke="#d9cbb4"/>
<text x="860" y="788" font-size="32" fill="#223c2b" text-anchor="middle">Buffer</text>
<text x="72" y="896" font-size="32" fill="#223c2b" font-weight="700">Lease, retry, dead-letter.</text>
<text x="72" y="940" font-size="30" fill="#536649">An outage delays delivery; failures are kept, not lost.</text>
<text x="72" y="1012" font-size="32" fill="#223c2b" font-weight="700">Redelivery can’t duplicate.</text>
<text x="72" y="1056" font-size="30" fill="#536649">Linear issue ids are derived from the record,</text>
<text x="72" y="1096" font-size="30" fill="#536649">so a retry finds the issue instead of re-creating it.</text>
<rect x="72" y="1130" width="936" height="81" rx="18" fill="#e8dec8"/>
<text x="108" y="1182" font-size="30" fill="#223c2b">Same contract for every integration: one <tspan font-family="Menlo, monospace" fill="#47733e">Sink</tspan> trait.</text>
<path d="M72 1249H1008" stroke="#cabb9f"/>
<text x="72" y="1297" font-size="20" fill="#536649" letter-spacing="1.5">TRANSACTIONAL OUTBOX</text>
<text x="1008" y="1297" font-size="24" fill="#806035" text-anchor="end">3 / 6</text>
</g></svg>
