name: Browser

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: sign in, first place, today
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: homestead
          POSTGRES_DB: homestead
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: homestead
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        run: cargo build --locked -p homestead-server --bin homestead
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
      - name: Config with integrations off
        run: |
          sed -e 's/enabled = true/enabled = false/g' \
              -e 's/secure_cookies = true/secure_cookies = false/' \
              -e 's|public_url = ".*"|public_url = "http://127.0.0.1:8088"|' \
              homestead.toml > "$RUNNER_TEMP/e2e.toml"
      - name: First steward
        id: user
        env:
          DATABASE_URL: postgres://postgres:homestead@localhost:54329/homestead
          HOMESTEAD_CONFIG: ${{ runner.temp }}/e2e.toml
        run: |
          ./target/debug/homestead migrate
          link=$(./target/debug/homestead user-add leah@example.org Leah steward | awk '/\/setup\// { print $1 }')
          echo "path=${link#*8088}" >> "$GITHUB_OUTPUT"
      - name: Sign in and add the first place
        env:
          DATABASE_URL: postgres://postgres:homestead@localhost:54329/homestead
          HOMESTEAD_CONFIG: ${{ runner.temp }}/e2e.toml
          BIND_ADDR: 127.0.0.1:8088
          HOMESTEAD_URL: http://127.0.0.1:8088
          SETUP_PATH: ${{ steps.user.outputs.path }}
        run: |  # zizmor: ignore[adhoc-packages] playwright is pinned to an exact version
          ./target/debug/homestead serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8088/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8088/healthz || { cat "$RUNNER_TEMP/serve.log"; exit 1; }
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/browser-e2e.mjs || { cat "$RUNNER_TEMP/serve.log"; exit 1; }
