[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "AGPL-3.0-or-later"

[workspace.dependencies]
homestead-domain = { path = "crates/domain" }
homestead-store = { path = "crates/store" }
homestead-bus = { path = "crates/bus" }
homestead-integrations = { path = "crates/integrations" }

anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
hmac = "0.13.0"
maud = { version = "0.27.0", features = ["axum"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "rustls"] }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "time", "json", "rust_decimal"] }
subtle = "2.6.1"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "serde-human-readable", "formatting", "parsing", "macros"] }
toml = "1.1.6"
toml_edit = "0.25.15"
base64 = "0.23.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
csv = "1.4.0"
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
